[build-system]
requires = ["setuptools>=77"]
build-backend = "_build_hook"
backend-path = ["."]

[project]
name = "pgc-assembler"
version = "5.0.0"
description = "PGC snapshot assembler — composes compiled projections into a manifest-pinned executable snapshot (import package: assembler)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Bhash Ganti", email = "bachipeachy@gmail.com" }]

keywords = ["protocol-governed-computing", "pgc", "snapshot", "assembler", "manifest"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Build Tools",
]

# `_profile_declaration` parses the snapshot profile's YAML block, and it is reached from
# `verify_snapshot` — the `verify` subcommand and the profile check inside assembly. A standalone
# install without this raises ModuleNotFoundError there instead of refusing.
dependencies = ["pyyaml"]

# Snapshot signing is a profile's selection, not a property of the core. A platform whose
# profile requires authenticated snapshots installs this; one that does not should not
# acquire a cryptography dependency because the capability exists elsewhere. Absent it,
# assembler.signing refuses rather than degrading to an unsigned success.
[project.optional-dependencies]
signing = ["cryptography>=42"]

[project.scripts]
snapshot_assembler = "assembler.cli:main"

[project.urls]
Homepage = "https://omnibachi.org/"
Repository = "https://github.com/protocol-governed-computing/snapshot_assembler"
Standard = "https://doi.org/10.5281/zenodo.22150616"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["assembler*"]

[tool.setuptools.package-data]
# VERSION has no extension, so it must be named explicitly. Scoped to the package
# rather than "*" — see the note in protocol_compiler.
"assembler" = ["VERSION"]
